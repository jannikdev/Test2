<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>VisionID — Schnelle Objekterkennung</title>

  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0a0e14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Minimalist Styling -->
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>

  <!-- Minimalist Loading Banner (sichtbar beim Start) -->
  <div id="loading-banner">
    <span id="loading-text">Vision-Modell wird geladen...</span>
    <div class="progress-track">
      <div id="loading-progress" class="progress-fill"></div>
    </div>
  </div>

  <div id="app">
    <!-- Top Status Bar -->
    <header class="top-bar">
      <div class="brand-section">
        <div id="status-dot" class="status-indicator"></div>
        <div>
          <div class="brand-title">VisionID</div>
          <div id="brand-status" class="brand-status">Initialisiere...</div>
        </div>
      </div>

      <!-- Umriss-Toggle: Schnell vs KI -->
      <div class="contour-switch" title="Umriss-Berechnungsmethode">
        <button id="btn-contour-fast" class="active">Schnell (60fps)</button>
        <button id="btn-contour-neural">KI-Maske</button>
      </div>
    </header>

    <!-- Main Viewport Container -->
    <main class="viewport-container">

      <!-- VIEW 1: LIVE SCANNER -->
      <section id="view-scan" class="view-section active">
        <div class="camera-wrapper">
          <video id="camera-video" autoplay playsinline muted></video>
          <canvas id="overlay-canvas"></canvas>

          <!-- Reticle Viewfinder -->
          <div id="reticle" class="reticle-container">
            <div class="reticle-corners"></div>
            <div class="reticle-crosshair"></div>
          </div>

          <!-- HUD Status Pill -->
          <div class="hud-status-pill active">
            <div class="dot"></div>
            <span id="hud-status-text">Kamera wird gestartet...</span>
          </div>

          <!-- Floating Result Card -->
          <div id="result-card" class="result-card">
            <div class="result-info">
              <img id="result-thumb" class="result-thumb" src="" alt="Thumbnail">
              <div class="result-texts">
                <div id="result-name" class="result-name">Objektname</div>
                <div class="result-meta">
                  <span id="confidence-badge" class="confidence-badge confidence-high">94% Match</span>
                </div>
              </div>
            </div>
          </div>

          <!-- Bottom Camera HUD Controls -->
          <div class="hud-actions">
            <button id="btn-flip-camera" class="btn-icon-subtle" title="Kamera wechseln">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 2.5 1.15 4.73 2.95 6.2"></path>
                <path d="M4 14c0 4.418 3.582 8 8 8s8-3.582 8-8c0-2.5-1.15-4.73-2.95-6.2"></path>
                <polyline points="20 4 20 10 14 10"></polyline>
                <polyline points="4 20 4 14 10 14"></polyline>
              </svg>
            </button>

            <!-- Manual Trigger Button -->
            <button id="btn-trigger-scan" class="btn-trigger-scan" title="Objekt jetzt erfassen">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>

            <div style="width: 44px;"></div> <!-- Spacer for symmetry -->
          </div>
        </div>
      </section>

      <!-- VIEW 2: OBJEKT ANLERNEN (TRAIN) -->
      <section id="view-train" class="view-section">
        <div class="panel-card">
          <h2 class="panel-title">Neues Objekt anlernen</h2>
          <p class="panel-desc">Halte das Objekt mittig in die Kamera und nimm 3 bis 5 Blickwinkel auf.</p>

          <div class="train-preview-box">
            <canvas id="train-overlay-canvas"></canvas>
          </div>

          <!-- 5 Snapshot Slots -->
          <div class="snapshots-grid">
            <div id="slot-0" class="snapshot-slot"></div>
            <div id="slot-1" class="snapshot-slot"></div>
            <div id="slot-2" class="snapshot-slot"></div>
            <div id="slot-3" class="snapshot-slot"></div>
            <div id="slot-4" class="snapshot-slot"></div>
          </div>

          <button id="btn-capture-shot" class="btn-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
            <span>Winkel aufnehmen (0/5)</span>
          </button>

          <div class="form-group" style="margin-top: 12px;">
            <label class="form-label">Bezeichnung des Objekts</label>
            <input type="text" id="input-obj-name" class="form-input" placeholder="z. B. Inbusschlüssel 6mm" autocomplete="off">
          </div>

          <button id="btn-save-object" class="btn-primary" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <span>Objekt speichern</span>
          </button>
        </div>
      </section>

      <!-- VIEW 3: OBJEKT-BIBLIOTHEK -->
      <section id="view-objects" class="view-section">
        <div class="library-header">
          <span class="library-title">Registrierte Objekte</span>
          <span id="lib-count" class="library-count">0 Objekte</span>
        </div>

        <div id="objects-list"></div>

        <div style="margin-top: 16px; display: flex; gap: 10px;">
          <button id="btn-export-vault" class="btn-secondary" style="margin-bottom: 0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Backup Export</span>
          </button>
          <button id="btn-import-vault" class="btn-secondary" style="margin-bottom: 0;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span>Import</span>
          </button>
          <input type="file" id="file-import" accept=".json" style="display: none;">
        </div>
      </section>
    </main>

    <!-- Bottom Navigation Tabs -->
    <nav class="bottom-nav">
      <button id="nav-scan" class="nav-tab-btn active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
          <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
          <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
          <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
          <line x1="7" y1="12" x2="17" y2="12"></line>
        </svg>
        <span>Scannen</span>
      </button>

      <button id="nav-train" class="nav-tab-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="16"></line>
          <line x1="8" y1="12" x2="16" y2="12"></line>
        </svg>
        <span>Anlernen</span>
      </button>

      <button id="nav-objects" class="nav-tab-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        <span>Objekte</span>
      </button>
    </nav>
  </div>

  <!-- Service Worker Registration for PWA / GitHub Pages -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

  <!-- Main ES Module Bootstrap -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
