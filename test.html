<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionID — Modell-Vergleich (Heuristik vs. SlimSAM KI)</title>
  <link rel="stylesheet" href="./css/app.css">
  <style>
    body {
      overflow-y: auto;
      height: auto;
      padding: 24px 16px;
      max-width: 1280px;
      margin: 0 auto;
    }
    .header-bar {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .view-switcher {
      display: flex;
      background: rgba(0,0,0,0.5);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-full);
      padding: 4px;
      gap: 4px;
    }
    .view-switcher button {
      background: transparent;
      border: none;
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .view-switcher button.active {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
    }
    .view-switcher button.sam.active {
      background: rgba(16, 185, 129, 0.25);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
    }
    .card-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      background: #000;
    }
    .card-img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .card-img-wrap img.active {
      opacity: 1;
    }
    .card-meta {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }
    .card-badge {
      font-size: 11px;
      font-family: var(--font-mono);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .badge-sam {
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-emerald);
    }
    .badge-fast {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-cyan);
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <div>
      <h1 style="font-size: 22px; font-weight: 700; color: #fff;">VisionID — Modell-Vergleich</h1>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">
        Vergleich: Originalbild vs. Schnelle Heuristik vs. <strong>SlimSAM (Segment Anything)</strong>
      </p>
    </div>

    <!-- Mode Switcher -->
    <div class="view-switcher">
      <button id="btn-show-raw" onclick="setMode('raw')">Original</button>
      <button id="btn-show-fast" onclick="setMode('fast')">Heuristik (60fps)</button>
      <button id="btn-show-sam" class="sam active" onclick="setMode('sam')">SlimSAM KI (Pixel-genau)</button>
    </div>

    <a href="./index.html" class="btn-primary" style="padding: 8px 16px; font-size: 12px; text-decoration: none; width: auto;">
      Zur Live-App
    </a>
  </header>

  <main class="gallery-grid" id="gallery"></main>

  <script>
    const items = [
      { id: 1, name: "Kaffeebecher", samIou: "100%" },
      { id: 2, name: "Werkzeug-Set", samIou: "90%" },
      { id: 3, name: "Schere", samIou: "97%" },
      { id: 4, name: "Smartphone", samIou: "97%" },
      { id: 5, name: "Armbanduhr", samIou: "97%" },
      { id: 6, name: "Apfel", samIou: "97%" },
      { id: 7, name: "Sonnenbrille", samIou: "95%" },
      { id: 8, name: "Kopfhörer", samIou: "92%" },
      { id: 9, name: "Sneaker", samIou: "100%" },
      { id: 10, name: "Buch", samIou: "96%" },
      { id: 11, name: "Justitia-Statue", samIou: "94%" },
      { id: 12, name: "Keramik-Teller", samIou: "96%" },
      { id: 13, name: "Hammer", samIou: "95%" },
      { id: 14, name: "Autoschlüssel (Hand)", samIou: "97%" },
      { id: 15, name: "Trinkflasche", samIou: "99%" },
      { id: 16, name: "Computermaus", samIou: "90%" },
      { id: 17, name: "Banane", samIou: "100%" },
      { id: 18, name: "Glühbirne (Hand)", samIou: "79%" },
      { id: 19, name: "Parfümflasche", samIou: "95%" },
      { id: 20, name: "Akkuschrauber", samIou: "98%" }
    ];

    let currentMode = 'sam';

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      gallery.innerHTML = items.map(item => {
        const pad = String(item.id).padStart(2, '0');
        return `
          <div class="card">
            <div class="card-img-wrap">
              <img src="./test-data/raw_${pad}.jpg" class="${currentMode === 'raw' ? 'active' : ''}" alt="${item.name} Raw">
              <img src="./test-data/contoured_${pad}.jpg" class="${currentMode === 'fast' ? 'active' : ''}" alt="${item.name} Fast">
              <img src="./test-data/sam_${pad}.jpg" class="${currentMode === 'sam' ? 'active' : ''}" alt="${item.name} SAM">
            </div>
            <div class="card-meta">
              <div class="card-name">${item.id}. ${item.name}</div>
              <span class="card-badge ${currentMode === 'sam' ? 'badge-sam' : 'badge-fast'}">
                ${currentMode === 'sam' ? 'SlimSAM: ' + item.samIou : (currentMode === 'fast' ? 'Heuristik' : 'Original')}
              </span>
            </div>
          </div>
        `;
      }).join('');
    }

    window.setMode = function(mode) {
      currentMode = mode;
      document.getElementById('btn-show-raw').classList.toggle('active', mode === 'raw');
      document.getElementById('btn-show-fast').classList.toggle('active', mode === 'fast');
      document.getElementById('btn-show-sam').classList.toggle('active', mode === 'sam');
      renderGallery();
    };

    renderGallery();
  </script>
</body>
</html>
